name: Nightly

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:

  verify:
    name: Full verification on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24', 'latest']

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies without the lock file
        # Catches breakage introduced by new releases of our development
        # dependencies before it reaches a pull request.
        run: npm install

      - name: Fetch the specification
        # Deliberately not continue-on-error, unlike CI: this is the run that
        # guarantees the registry is actually compared against the
        # specification rather than silently skipped.
        run: npm run fetch:spec

      # The property suites run from a fixed seed on every push, so that a red
      # run can be run again. The exploring happens here instead, where nobody
      # is waiting: a different seed each night, named in the failure message
      # and equal to this run number, so a red night reproduces exactly.
      - run: npm run verify
        env:
          MCBOR_PROPERTY_SEED: ${{ github.run_number }}

  platform:
    name: Platform JSON check on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24', 'latest']

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      # WP8: V8 caches an object's property keys against the keys of the object
      # it parsed before, and a key ending in an escaped backslash poisons that
      # cache — nodejs/node#63785, forwarded to V8 as issue 521080746. Nothing
      # in `src/` calls `JSON.parse`, so the library is not affected and there
      # is nothing here to fix; this **reports and does not fail**. It exists to
      # answer the two questions one machine could not: which versions carry it,
      # and when it goes away again.
      #
      # Both are answered. V8 fixed it on main on 2026-09-17 (93cd21e, crbug
      # 521080746), the backport reached the 24 line, and on 2026-11-01 every
      # version in this matrix - 20, 22, 24 and latest - read every escaped key
      # back. The job stays as a regression guard: a hit now means the fix came
      # undone, which is a different and more interesting report than the one
      # it was built for.
      #
      # No dependencies are installed. The script has none, deliberately: a
      # demonstration that needs a toolchain is one more thing its reader has
      # to rule out before believing it. It is deterministic and takes
      # milliseconds.
      - name: Does this Node lose an escaped object key?
        run: |
          if node scripts/v8-json-key-repro.mjs; then
            echo "\`$(node -v)\`: reads every escaped key back correctly." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "\`$(node -v)\`: **loses escaped object keys** — a REGRESSION of nodejs/node#63785, fixed in V8 93cd21e and clean on every supported Node since 2026-11-01. See WORKPLAN.md, WP8." >> "$GITHUB_STEP_SUMMARY"
          fi

  coverage:
    name: Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
        env:
          MCBOR_PROPERTY_SEED: ${{ github.run_number }}

      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  fuzz:
    name: Fuzz corpus
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Run the corpus at full size
        # Two hundred thousand cases per property, against mutated golden
        # vectors, random bytes, text from the grammar's own alphabet and
        # generated JSON documents. A pull request runs two thousand, which is
        # what it can afford; this is the run nobody is waiting for.
        env:
          MCBOR_FUZZ_RUNS: '200000'
        run: npx vitest run tests/fuzz --reporter=dot

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Audit the dependency tree
        # Red on GHSA-g3hv-75wg-m249 (moderate, a denial of service in
        # minimatch through amplified glob patterns), and red until typedoc
        # moves. The advisory is fixed from minimatch 11.0.1, and typedoc
        # 0.28.20 — still the newest release, still asking for `minimatch ^10`
        # — calls `mini.matchOne(...)` from `glob().shouldRecurse` whenever
        # the walk that expands `entryPoints` descends into a subdirectory of
        # `src/`, and this repository has six. minimatch kept `matchOne` public
        # through 10.2.6 and left only the private `#matchOne` from 11.0.0 on,
        # so in every release from 11.0.0 to 11.0.4 that call throws
        # `TypeError: mini.matchOne is not a function`. Everything that closes
        # the advisory therefore breaks `docs:api`, and there is no lower 11.x
        # to pin: this step is not waiting on a release of minimatch but on
        # typedoc. The globs are this repository's own configuration and the
        # package has no runtime dependencies — CHANGELOG 0.12.0 has the rest.
        run: npm audit --audit-level=moderate
