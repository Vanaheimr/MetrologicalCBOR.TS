name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  verify:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:   [ubuntu-latest]
        node: ['20', '22', '24']
        include:
          - os:   windows-latest
            node: '22'
          - os:   macos-latest
            node: '22'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch the specification
        # The specification lives in its own repository and is not committed
        # here. With it present the conformance suite compares the unit
        # registry against the document entry by entry; without it that suite
        # skips. A network failure must not block a pull request, so this step
        # may fail — the nightly workflow runs the same fetch without that
        # licence, so a persistent problem still surfaces within a day.
        run: npm run fetch:spec
        continue-on-error: true

      - name: Verify
        # One command rather than its parts spelled out again here. Twice now a
        # check has existed in this file and not in `npm run verify`, and both
        # times the gap was invisible until a release failed: a contributor ran
        # verify, saw green, and CI ran something else. The script is the
        # definition; this runs it.
        #
        # It builds before it tests, because tests/bundle.test.ts loads the
        # built bundle in a context with no Node globals at all — which is how
        # "runs in a browser" stops being a claim and becomes a test — and skips
        # where dist/ is absent.
        run: npm run verify

  bare:
    name: Verify without the specification
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Deliberately no `npm run fetch:spec`. The specification lives in its own
      # repository and is not committed here, so the suites that compare against
      # it are written to skip where it is absent — and the README promises a
      # fresh clone can run `npm run verify`.
      #
      # Nothing enforced that promise. The matrix job above fetches the document
      # first, so it never exercised the path, and the gap surfaced where it
      # costs the most: the release workflow does not fetch either, and a suite
      # that was supposed to skip read the file at collection time and threw.
      # Two releases failed before anyone was looking at the right thing.
      - name: Verify on a bare clone
        run: npm run verify

  examples:
    name: Examples
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Install the examples' own dependency
        # @noble/curves lives in examples/package.json rather than in the
        # library's, so that a root `npm ci` never installs a cryptography
        # library to test a data format. Installed here, the signature example
        # verifies the four signatures over the specification's worked record
        # instead of skipping.
        run: npm install --prefix examples

      - name: Type check the examples
        # Not part of `npm run verify`: the root configuration cannot resolve a
        # dependency the root package does not have, and a contributor who has
        # not installed it must still be able to verify the library.
        run: npm run typecheck:examples

      - name: Run every example
        run: npx vitest run tests/examples.test.ts

  package:
    name: Package smoke test
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Pack
        run: npm pack --pack-destination /tmp

      - name: Install the tarball into a clean project and import it
        run: |
          mkdir -p /tmp/smoke && cd /tmp/smoke
          npm init -y > /dev/null
          npm install /tmp/*.tgz
          node --input-type=module -e "
            import { METROLOGICAL_VALUE_TAG, UnitRegistry } from '@vanaheimr/metrological-cbor';
            if (METROLOGICAL_VALUE_TAG !== 44252) throw new Error('wrong tag');
            if (UnitRegistry.standard.bySymbol('V').id !== 5) throw new Error('wrong unit');
            console.log('ESM import ok');
          "
          node --input-type=commonjs -e "
            const { METROLOGICAL_VALUE_TAG } = require('@vanaheimr/metrological-cbor');
            if (METROLOGICAL_VALUE_TAG !== 44252) throw new Error('wrong tag');
            console.log('CommonJS require ok');
          "
